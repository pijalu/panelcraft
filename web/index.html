<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PanelCraft</title>
    <!-- UX08-WP04: installable PWA. All URLs are relative so the same bundle works
         at / (Go server, GitHub Pages) and under a sub-path build (--base=/x/). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Offline-first C4 and architecture diagrams with a WYSIWYG canvas and a code view." />
    <script>
      // Apply the validated workspace-theme boot hint before the bundle paints.
      (() => {
        let preference = 'system';
        try {
          const saved = JSON.parse(localStorage.getItem('panelcraft.app-theme') || 'null');
          if (saved?.version === 1 && ['system', 'light', 'dark'].includes(saved.preference)) {
            preference = saved.preference;
          }
        } catch { /* blocked/corrupt boot hints fall back to System */ }
        const dark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
