# CI — SPEC §8.5 stage chain: build web → lint-go (the Go packages embed
# web/dist, so the bundle must exist before vet/test/build) → lint-web →
# test-go → test-web → build go → asset-origin scan → e2e smoke (network
# blocked in-spec, S7) → visual-harness noop. This is the stage order
# `scripts/verify.sh` uses for every milestone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the identifier-clarity check can diff against main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Deps
        run: |
          npm ci
          go mod download
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      # ---- build web ----
      # First, because `internal/*` and `cmd/panelcraft` embed `web/dist`: without
      # the bundle `go vet`, `staticcheck` and `go test` all fail on
      # `pattern all:dist: no matching files found`. `scripts/verify.sh` orders
      # its stages the same way.
      - name: build web
        run: npm run build

      # ---- lint-go ----
      - name: lint-go (vet + staticcheck + gocyclo ≤15)
        run: |
          go vet ./...
          staticcheck ./...
          gocyclo -over 15 cmd internal web

      # ---- lint-web ----
      - name: lint-web (tsc + eslint, complexity ≤12)
        run: npm run check

      # ---- test-go ----
      - name: test-go
        run: go test ./...

      # ---- test-web ----
      - name: test-web (vitest + coverage thresholds 80/60)
        run: npm test

      # ---- perf ----
      # Uninstrumented on purpose: `npm test` runs with V8 coverage, and a budget
      # measured under the instrumenter is not the budget (`scripts/verify.sh`
      # keeps its perf stages separate from the covered test run for the same
      # reason).
      - name: perf budgets (latency, no coverage instrumentation)
        run: npm run test:perf

      # ---- build go ----
      - name: build go (embeds web/dist)
        run: go build ./...

      # ---- docs + identifier clarity ----
      # Doc links resolve, and no change adds a bare tag like "N7" where the words
      # belong (glossary: agents.md).
      - name: docs links + identifier clarity
        run: |
          bash scripts/check-docs.sh
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          bash scripts/check-jargon.sh origin/main

      # ---- asset-origin scan ----
      # Nothing may load from an external origin: no CDN, no webfonts.
      - name: asset-origin scan
        run: bash scripts/check-selfcontained.sh web/dist

      # ---- e2e smoke (S7 skeleton, all external requests blocked in-spec) ----
      - name: e2e smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      # A red e2e run is only actionable with the trace, so keep it on failure.
      - name: upload e2e artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts
          path: test-results/
          retention-days: 7

      # ---- repo hygiene (F-09): e2e must not dirty the worktree ----
      - name: repo-hygiene
        run: bash scripts/check-repo-clean.sh --worktree

      # ---- visual-harness noop ----
      # Playwright visual diff + pixelmatch harness activate with M2 canvas
      # screenshots (SPEC §8.3); S7 already captures light+dark baselines.
      - name: visual-harness (noop until M2)
        run: echo "visual diff harness lands with M2 — noop in M0"
