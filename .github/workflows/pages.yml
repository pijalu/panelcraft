# GitHub Pages deployment — STUB (PLAN §2 M0-WP4).
# Build-only proof of wiring now; actual Pages deploy enablement lands with
# M7 release engineering (SPEC FR-H, hosting). Enable the `deploy` job then.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'vite.config.ts', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pages serves a project site at /<repo>/, so the bundle must be built with
      # that base: the default base emits `/assets/...`, which resolves to the
      # domain root and 404s (blank page). Everything else in the bundle is
      # already relative, including the service-worker scope (`baseURI`).
      - name: build for the project sub-path
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: the bundle must not point at the domain root
        run: |
          if grep -qE '(src|href)="/assets/' web/dist/index.html; then
            echo '::error::index.html references /assets — Pages serves /<repo>/ and would 404'
            exit 1
          fi
      - name: asset-origin scan (self-containment holds on Pages too)
        run: bash scripts/check-selfcontained.sh web/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # Live since M7: Pages environment must exist (repo Settings → Pages →
  # GitHub Actions source). Serves the SPA offline-capable (SPEC FR-H, N8).
  deploy:
    if: true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
