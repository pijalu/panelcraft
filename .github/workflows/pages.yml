# GitHub Pages deployment — STUB (PLAN §2 M0-WP4).
# Build-only proof of wiring now; actual Pages deploy enablement lands with
# M7 release engineering (SPEC FR-H, hosting). Enable the `deploy` job then.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'vite.config.ts', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: asset-origin scan (self-containment holds on Pages too)
        run: bash scripts/check-selfcontained.sh web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # STUB: flip to `if: true` in M7 after configuring the Pages environment.
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
